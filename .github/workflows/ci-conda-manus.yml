name: manus-build

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'cmake/**'
      - '.github/workflows/ci-conda-manus.yml'
      - 'ManusGlove/**'
      - '!ManusGlove/**/*.md'
      - '!ManusGlove/**/*.xml'
  pull_request:
    paths:
      - 'cmake/**'
      - '.github/workflows/ci-conda-manus.yml'
      - 'ManusGlove/**'
      - '!ManusGlove/**/*.md'
      - '!ManusGlove/**/*.xml'
  workflow_dispatch:

jobs:
  build-manus:
    name: ${{ matrix.os }} / Manus SDK ${{ matrix.manus_sdk_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            manus_sdk_version: "2.5.1"
          - os: ubuntu-latest
            manus_sdk_version: "3.1.1"
          - os: ubuntu-latest
            manus_sdk_version: "3.2.1"
          - os: windows-latest
            manus_sdk_version: "2.5.1"
          - os: windows-latest
            manus_sdk_version: "3.1.1"
          - os: windows-latest
            manus_sdk_version: "3.2.1"
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC toolchain (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup micromamba environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: yarp-device-haptic-gloves-ci
          init-shell: >-
            bash
            powershell
          cache-environment: true
          create-args: >-
            python=3.11
            cmake
            ninja
            pkg-config
            compilers
            eigen
            colcon-common-extensions
            yarp
            human-dynamics-estimation

      - name: Build (with colcon)
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            colcon build \
              --merge-install \
              --event-handlers console_direct+ \
              --cmake-args \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=cl \
                -DCMAKE_CXX_COMPILER=cl \
                -DYARP_DEVICE_MANUS_GLOVE_ENABLE=ON \
                -DENABLE_MANUS_SDK_DOWNLOAD=ON \
                -DMANUS_SDK_DOWNLOAD_VERSION=${{ matrix.manus_sdk_version }}
          else
            colcon build \
              --merge-install \
              --event-handlers console_direct+ \
              --cmake-args \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DYARP_DEVICE_MANUS_GLOVE_ENABLE=ON \
                -DENABLE_MANUS_SDK_DOWNLOAD=ON \
                -DMANUS_SDK_DOWNLOAD_VERSION=${{ matrix.manus_sdk_version }}
          fi

      - name: Dump CMake logs (on failure)
        if: failure()
        run: |
          find build -type f \( -name CMakeConfigureLog.yaml -o -name CMakeError.log -o -name CMakeOutput.log \) | while read -r f; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Test device loading (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          source install/setup.sh
          yarp plugin ManusGlove

      - name: Test device loading (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . install/setup.ps1
          yarp plugin ManusGlove
